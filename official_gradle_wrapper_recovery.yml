name: Official Gradle 8.9 Wrapper Bin Recovery & Safety Build

on:
  workflow_dispatch:

jobs:
  secure-recover-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download, Verify and Extract Official Gradle 8.9 in /tmp
        run: |
          DIST_URL="https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          SHA_URL="https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256"
          
          echo "Downloading official Gradle 8.9 binary zip to /tmp..."
          curl -f -L -o /tmp/gradle-8.9-bin.zip "$DIST_URL" || { echo "::error::Failed to download gradle-8.9-bin.zip"; exit 1; }
          
          echo "Downloading official SHA-256 checksum file..."
          curl -f -L -o /tmp/gradle-8.9-bin.zip.sha256 "$SHA_URL" || { echo "::error::Failed to download sha256 file"; exit 1; }
          
          echo "Verifying SHA-256 checksum of binary distribution..."
          EXPECTED_HASH=$(cat /tmp/gradle-8.9-bin.zip.sha256 | awk '{print $1}')
          ACTUAL_HASH=$(sha256sum /tmp/gradle-8.9-bin.zip | awk '{print $1}')
          
          echo "Expected: $EXPECTED_HASH"
          echo "Actual:   $ACTUAL_HASH"
          
          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "::error::Checksum verification FAILED for gradle-8.9-bin.zip! Aborting immediately."
            rm -f /tmp/gradle-8.9-bin.zip /tmp/gradle-8.9-bin.zip.sha256
            exit 1
          fi
          
          echo "Checksum verification SUCCESSFUL!"
          rm -f /tmp/gradle-8.9-bin.zip.sha256

          echo "Extracting verified Gradle distribution to /tmp/gradle-8.9..."
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp/

      - name: Snapshot Properties, Generate Wrapper, and Validate
        run: |
          PROPS_PATH="gradle/wrapper/gradle-wrapper.properties"
          
          if [ -f "$PROPS_PATH" ]; then
            echo "Saving original state of gradle-wrapper.properties..."
            cp "$PROPS_PATH" gradle-wrapper.properties.bak
            ORIGINAL_PROPS_HASH=$(sha256sum "$PROPS_PATH" | awk '{print $1}')
            echo "Original properties SHA-256: $ORIGINAL_PROPS_HASH"
          else
            echo "::error::gradle-wrapper.properties is missing from repository!"
            exit 1
          fi

          echo "Generating wrapper using official Gradle 8.9 binary from /tmp..."
          export GRADLE_USER_HOME="/tmp/.gradle"
          /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --distribution-type bin

          # Restore original gradle-wrapper.properties exactly
          echo "Restoring original gradle-wrapper.properties..."
          mv gradle-wrapper.properties.bak "$PROPS_PATH"

          # Discard any modifications to gradlew and gradlew.bat to keep repo clean
          git checkout -- gradlew gradlew.bat 2>/dev/null || true

          # Verify properties hash matches original
          RESTORED_PROPS_HASH=$(sha256sum "$PROPS_PATH" | awk '{print $1}')
          if [ "$ORIGINAL_PROPS_HASH" != "$RESTORED_PROPS_HASH" ]; then
            echo "::error::gradle-wrapper.properties hash mismatch after restoration!"
            exit 1
          fi
          echo "Properties verification PASSED: 100% original content preserved."

          # Verify generated wrapper JAR exists and is non-zero
          JAR_PATH="gradle/wrapper/gradle-wrapper.jar"
          if [ ! -f "$JAR_PATH" ] || [ ! -s "$JAR_PATH" ]; then
            echo "::error::gradle-wrapper.jar is missing or empty!"
            exit 1
          fi

          # CRITICAL CLASS VERIFICATION: Verify GradleWrapperMain.class exists inside the JAR
          echo "Verifying presence of GradleWrapperMain class inside JAR..."
          jar tf "$JAR_PATH" | grep 'org/gradle/wrapper/GradleWrapperMain.class' || {
            echo "::error::GradleWrapperMain.class not found in generated wrapper JAR!"
            exit 1
          }
          echo "Class verification PASSED: GradleWrapperMain.class is present."

      - name: Pre-Build Git Status Safety Check
        run: |
          echo "Running pre-build strict git status safety check..."
          STATUS_OUTPUT=$(git status --porcelain)
          echo "Git status output:"
          echo "$STATUS_OUTPUT"
          
          FILE_COUNT=$(echo "$STATUS_OUTPUT" | grep -v '^$' | wc -l)
          
          if [ "$FILE_COUNT" -ne 1 ]; then
            echo "::error::Safety check FAILED! Expected exactly 1 changed/untracked file, but found $FILE_COUNT files."
            exit 1
          fi
          
          if ! echo "$STATUS_OUTPUT" | grep -q "gradle/wrapper/gradle-wrapper.jar"; then
            echo "::error::Safety check FAILED! The changed file is not gradle-wrapper.jar."
            exit 1
          fi
          
          echo "PRE-BUILD SAFETY CHECK PASSED."

      - name: Run Build Test Using Verified Extracted Gradle 8.9 Binary
        run: |
          echo "Running build test with official extracted binary..."
          export GRADLE_USER_HOME="/tmp/.gradle"
          /tmp/gradle-8.9/bin/gradle assembleDebug --no-daemon

      - name: Post-Build Git Status Safety Check
        run: |
          echo "Running post-build strict git status safety check..."
          STATUS_OUTPUT=$(git status --porcelain)
          echo "$STATUS_OUTPUT"
          
          FILE_COUNT=$(echo "$STATUS_OUTPUT" | grep -v '^$' | wc -l)
          if [ "$FILE_COUNT" -ne 1 ] || ! echo "$STATUS_OUTPUT" | grep -q "gradle/wrapper/gradle-wrapper.jar"; then
            echo "::error::Post-build safety check FAILED! Unintended files were modified during the build."
            exit 1
          fi
          echo "POST-BUILD SAFETY CHECK PASSED."

      - name: Cleanup Build Binaries
        if: always()
        run: |
          echo "Cleaning up temporary files from /tmp..."
          rm -rf /tmp/gradle-8.9-bin.zip /tmp/gradle-8.9 /tmp/.gradle

      - name: Commit and Push Restored Wrapper JAR
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar
          git commit -m "chore: securely generate and restore verified official gradle-8.9 wrapper-jar" || echo "No changes to commit"
          git push

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: '**/build/outputs/apk/debug/*.apk'
