name: Official Gradle 8.2 Wrapper Recovery & Safety Build

on:
  workflow_dispatch:

jobs:
  recover-wrapper-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and Verify Official Gradle 8.2
        run: |
          set -e

          DIST_URL="https://services.gradle.org/distributions/gradle-8.2-bin.zip"
          SHA_URL="https://services.gradle.org/distributions/gradle-8.2-bin.zip.sha256"

          curl -fL -o gradle-8.2-bin.zip "$DIST_URL"
          curl -fL -o gradle-8.2-bin.zip.sha256 "$SHA_URL"

          EXPECTED_HASH=$(awk '{print $1}' gradle-8.2-bin.zip.sha256)
          ACTUAL_HASH=$(sha256sum gradle-8.2-bin.zip | awk '{print $1}')

          echo "Expected: $EXPECTED_HASH"
          echo "Actual:   $ACTUAL_HASH"

          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "::error::Gradle 8.2 checksum verification FAILED."
            exit 1
          fi

          echo "Gradle 8.2 checksum verification PASSED."

      - name: Generate and Verify Wrapper JAR
        run: |
          set -e

          PROPS="gradle/wrapper/gradle-wrapper.properties"
          JAR="gradle/wrapper/gradle-wrapper.jar"

          if [ ! -f "$PROPS" ]; then
            echo "::error::gradle-wrapper.properties is missing."
            exit 1
          fi

          ORIGINAL_PROPS_HASH=$(sha256sum "$PROPS" | awk '{print $1}')

          unzip -q gradle-8.2-bin.zip

          ./gradle-8.2/bin/gradle wrapper \
            --gradle-version 8.2 \
            --distribution-type bin

          RESTORED_PROPS_HASH=$(sha256sum "$PROPS" | awk '{print $1}')

          if [ "$ORIGINAL_PROPS_HASH" != "$RESTORED_PROPS_HASH" ]; then
            echo "::error::gradle-wrapper.properties was modified."
            exit 1
          fi

          if [ ! -f "$JAR" ]; then
            echo "::error::gradle-wrapper.jar was not generated."
            exit 1
          fi

          if [ ! -s "$JAR" ]; then
            echo "::error::gradle-wrapper.jar is empty."
            exit 1
          fi

          echo "Checking GradleWrapperMain.class..."
          jar tf "$JAR" | grep -Fx \
            "org/gradle/wrapper/GradleWrapperMain.class"

          echo "GradleWrapperMain.class verification PASSED."

      - name: Verify Only Wrapper JAR Changed
        run: |
          set -e

          echo "Git status:"
          git status --short

          STATUS_PATHS=$(git status --porcelain=v1 | sed 's/^.. //')

          if [ "$STATUS_PATHS" != "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::Unexpected changed files detected."
            echo "$STATUS_PATHS"
            exit 1
          fi

          DIFF_PATHS=$(git diff --name-only)

          if [ -n "$DIFF_PATHS" ]; then
            echo "::error::Tracked files were modified:"
            echo "$DIFF_PATHS"
            exit 1
          fi

          echo "SAFETY CHECK PASSED."
          echo "Only gradle/wrapper/gradle-wrapper.jar changed."

      - name: Verify Wrapper JAR Directly
        run: |
          set -e

          test -f gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.jar

          java \
            -cp gradle/wrapper/gradle-wrapper.jar \
            org.gradle.wrapper.GradleWrapperMain \
            --version

          echo "Direct GradleWrapperMain test PASSED."

      - name: Build APK Using Verified Gradle 8.2
        run: |
          set -e

          ./gradle-8.2/bin/gradle assembleDebug --no-daemon

          echo "APK build PASSED."

      - name: Verify No Unintended Files After Build
        run: |
          set -e

          STATUS_PATHS=$(git status --porcelain=v1 | sed 's/^.. //')

          echo "Post-build Git status:"
          git status --short

          if [ "$STATUS_PATHS" != "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::Build modified unexpected files."
            echo "$STATUS_PATHS"
            exit 1
          fi

          DIFF_PATHS=$(git diff --name-only)

          if [ -n "$DIFF_PATHS" ]; then
            echo "::error::Tracked files were modified by the build:"
            echo "$DIFF_PATHS"
            exit 1
          fi

          echo "POST-BUILD SAFETY CHECK PASSED."

      - name: Commit Wrapper JAR
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add gradle/wrapper/gradle-wrapper.jar

          git diff --cached --name-only

          git diff --cached --name-only | grep -Fx \
            "gradle/wrapper/gradle-wrapper.jar"

          git commit \
            -m "chore: restore Gradle 8.2 wrapper jar"

          git push

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tricky-mind-3d-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

      - name: Cleanup Temporary Gradle Files
        if: always()
        run: |
          rm -rf gradle-8.2-bin.zip
          rm -rf gradle-8.2
          rm -f gradle-8.2-bin.zip.sha256
