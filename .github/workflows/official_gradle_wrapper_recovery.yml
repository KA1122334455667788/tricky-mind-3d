name: Gradle 8.9 Wrapper Recovery & APK Build

on:
  workflow_dispatch:

jobs:
  recover-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and Verify Gradle 8.9
        run: |
          set -e

          DIST_URL="https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          SHA_URL="https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256"

          curl -fL -o gradle-8.9-bin.zip "$DIST_URL"
          curl -fL -o gradle-8.9-bin.zip.sha256 "$SHA_URL"

          EXPECTED_HASH=$(awk '{print $1}' gradle-8.9-bin.zip.sha256)
          ACTUAL_HASH=$(sha256sum gradle-8.9-bin.zip | awk '{print $1}')

          echo "Expected: $EXPECTED_HASH"
          echo "Actual:   $ACTUAL_HASH"

          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "::error::Gradle 8.9 checksum verification FAILED."
            exit 1
          fi

          echo "Gradle 8.9 checksum verification PASSED."

      - name: Generate Gradle 8.9 Wrapper JAR
        run: |
          set -e

          PROPS="gradle/wrapper/gradle-wrapper.properties"
          JAR="gradle/wrapper/gradle-wrapper.jar"

          test -f "$PROPS"

          ORIGINAL_HASH=$(sha256sum "$PROPS" | awk '{print $1}')

          unzip -q gradle-8.9-bin.zip

          ./gradle-8.9/bin/gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

          CURRENT_HASH=$(sha256sum "$PROPS" | awk '{print $1}')

          if [ "$ORIGINAL_HASH" != "$CURRENT_HASH" ]; then
            echo "::error::gradle-wrapper.properties was modified."
            exit 1
          fi

          test -f "$JAR"
          test -s "$JAR"

          jar tf "$JAR" | grep -Fx \
            "org/gradle/wrapper/GradleWrapperMain.class"

          echo "Wrapper JAR verification PASSED."

      - name: Verify Only Wrapper JAR Changed
        run: |
          set -e

          git status --short

          STATUS_PATHS=$(git status --porcelain=v1 | sed 's/^.. //')

          if [ "$STATUS_PATHS" != "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::Unexpected files changed."
            echo "$STATUS_PATHS"
            exit 1
          fi

          echo "Safety check PASSED."

      - name: Test Wrapper Directly
        run: |
          set -e

          java \
            -cp gradle/wrapper/gradle-wrapper.jar \
            org.gradle.wrapper.GradleWrapperMain \
            --version

          echo "
