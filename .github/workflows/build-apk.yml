name: Official Gradle 8.2 Wrapper Bin Recovery & Safety Build

on:
  workflow_dispatch:

jobs:
  secure-recover-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and Verify Official Gradle 8.2 Bin ZIP
        run: |
          DIST_URL="https://services.gradle.org/distributions/gradle-8.2-bin.zip"
          SHA_URL="https://services.gradle.org/distributions/gradle-8.2-bin.zip.sha256"

          curl -fL -o gradle-8.2-bin.zip "$DIST_URL"
          curl -fL -o gradle-8.2-bin.zip.sha256 "$SHA_URL"

          EXPECTED_HASH=$(awk '{print $1}' gradle-8.2-bin.zip.sha256)
          ACTUAL_HASH=$(sha256sum gradle-8.2-bin.zip | awk '{print $1}')

          echo "Expected: $EXPECTED_HASH"
          echo "Actual:   $ACTUAL_HASH"

          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "::error::Gradle 8.2 ZIP checksum verification FAILED"
            exit 1
          fi

          echo "Checksum verification SUCCESSFUL!"

      - name: Extract Gradle and Generate Wrapper JAR
        run: |
          unzip -q gradle-8.2-bin.zip

          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::gradle-wrapper.jar was not generated"
            exit 1
          fi

          echo "gradle-wrapper.jar successfully generated."

          rm -rf gradle-8.2-bin.zip gradle-8.2-bin.zip.sha256 gradle-8.2

      - name: Final Safety Check
        run: |
          echo "Checking project changes..."

          CHANGED_FILES=$(git status --porcelain | sed 's/^.. //' | grep -v '^$' || true)

          echo "Detected changes:"
          printf '%s\n' "$CHANGED_FILES"

          TARGET_FILE="gradle/wrapper/gradle-wrapper.jar"

          if [ -z "$CHANGED_FILES" ]; then
            echo "::error::No wrapper JAR change detected."
            exit 1
          fi

          FILE_COUNT=$(printf '%s\n' "$CHANGED_FILES" | wc -l | tr -d ' ')

          if [ "$FILE_COUNT" -ne 1 ]; then
            echo "::error::Safety check FAILED: more than one file changed."
            git status --short
            exit 1
          fi

          if [ "$CHANGED_FILES" != "$TARGET_FILE" ]; then
            echo "::error::Safety check FAILED: unexpected file changed."
            git status --short
            exit 1
          fi

          echo "SAFETY CHECK PASSED."
          echo "Only gradle/wrapper/gradle-wrapper.jar changed."

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Commit Restored Wrapper JAR
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add gradle/wrapper/gradle-wrapper.jar

          git diff --cached --name-only

          git commit -m "chore: restore Gradle 8.2 wrapper JAR"
          git push

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tricky-mind-3d-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
